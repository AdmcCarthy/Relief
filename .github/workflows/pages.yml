name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --all-groups
      - name: Fetch the published data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/fetch_data.py --dest data/out
      - name: Contract check on the fetched data
        run: uv run python scripts/contract.py check data/out
      - name: Quality checks on the committed layers
        run: uv run pytest -q
      - name: Assemble the preview
        run: |
          mkdir -p _site/data
          cp preview/*.html preview/*.js _site/
          cp -r data/out/* _site/data/
          mkdir -p _site/regions && cp regions/*.json regions/*.geojson _site/regions/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install the browser test
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser smoke test of the assembled site
        timeout-minutes: 15
        run: |
          (cd _site && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          mkdir -p shots
          NODE_PATH="$PWD/tests/e2e/node_modules" node tests/e2e/check_pages.mjs http://localhost:8765 shots
      - name: Keep the screenshots when the browser test fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-shots
          path: shots
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
