name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --all-groups
      - name: Fetch the published data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/fetch_data.py --dest data/out
      - name: Contract check on the fetched data
        run: uv run python scripts/contract.py check data/out
      - name: Quality checks on the committed layers
        run: uv run pytest -q
      - name: Assemble the preview
        run: |
          mkdir -p _site/data
          cp preview/*.html preview/*.js _site/
          cp -r data/out/* _site/data/
          mkdir -p _site/regions && cp regions/*.json regions/*.geojson _site/regions/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install the browser test
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser smoke test of the assembled site
        timeout-minutes: 15
        run: |
          (cd _site && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          mkdir -p shots
          NODE_PATH="$PWD/tests/e2e/node_modules" node tests/e2e/check_pages.mjs http://localhost:8765 shots
      - name: Keep the screenshots when the browser test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-shots
          path: shots
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 (upload-artifact v7)
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
